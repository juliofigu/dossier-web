<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dossier</title>

  <style>
    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      overflow: hidden;
    }

    .viewer {
      position: fixed;
      inset: 0;
    }

    .viewer iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    .download-button {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 10;
      color: white;
      background: #16a34a;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      transition: background 0.2s ease;
    }

    .download-button:hover {
      background: #15803d;
    }

    .fallback {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 10;
      margin: 0;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(17, 24, 39, 0.88);
      font-size: 14px;
      text-align: center;
      max-width: calc(100vw - 28px);
    }

    .fallback a {
      color: #60a5fa;
      font-weight: 600;
      text-decoration: none;
    }

    .fallback a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .download-button {
        top: auto;
        bottom: 70px;
        right: 14px;
      }

      .fallback {
        bottom: 14px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <a
    class="download-button"
    href="dossier.pdf"
    download="dossier.pdf"
    aria-label="Descargar dossier en PDF"
  >
    Descargar PDF
  </a>

  <main class="viewer">
    <iframe
      src="dossier.pdf#view=FitH"
      title="Dossier en PDF"
      loading="eager"
    ></iframe>
  </main>
  
</body>
</html>
