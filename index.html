<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dossier</title>

  <style>
    html,
    body {
      overscroll-behavior-y: contain; /* bloquea el "tirar para actualizar" */
    }

    body {
      margin: 0;
      background: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #pages {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 10px 0 60px;
    }

    canvas {
      background: white;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      max-width: calc(100vw - 16px);
      height: auto;
    }

    .download-button {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 10;
      color: white;
      background: #16a34a;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    #status {
      color: #e5e7eb;
      text-align: center;
      padding: 60px 20px;
      font-size: 15px;
    }

    #status a {
      color: #60a5fa;
    }
  </style>
</head>

<body>
  <a class="download-button" href="dossier.pdf" download="dossier.pdf">
    Descargar PDF
  </a>

  <div id="status">Cargando dossier…</div>
  <div id="pages"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    const PDF_URL = "dossier.pdf";
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const statusEl = document.getElementById("status");
    const pagesEl = document.getElementById("pages");
    let renderToken = 0;

    async function renderAll() {
      const token = ++renderToken;
      pagesEl.innerHTML = "";
      statusEl.style.display = "block";
      statusEl.textContent = "Cargando dossier…";

      try {
        const pdf = await pdfjsLib.getDocument(PDF_URL).promise;
        if (token !== renderToken) return;
        statusEl.style.display = "none";

        const maxWidth = Math.min(window.innerWidth - 16, 1000);

        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          if (token !== renderToken) return;

          const base = page.getViewport({ scale: 1 });
          const scale = maxWidth / base.width;
          const viewport = page.getViewport({ scale });

          const ratio = window.devicePixelRatio || 1;
          const canvas = document.createElement("canvas");
          canvas.width = Math.floor(viewport.width * ratio);
          canvas.height = Math.floor(viewport.height * ratio);
          canvas.style.width = Math.floor(viewport.width) + "px";

          pagesEl.appendChild(canvas);

          const ctx = canvas.getContext("2d");
          ctx.scale(ratio, ratio);

          await page.render({ canvasContext: ctx, viewport }).promise;
        }
      } catch (err) {
        statusEl.innerHTML =
          'No se pudo cargar el visor. <a href="dossier.pdf" target="_blank" rel="noopener">Abrir PDF</a> o <a href="dossier.pdf" download="dossier.pdf">descargarlo</a>.';
      }
    }

    // SOLO redibuja si cambia el ANCHO de la pantalla (rotar el teléfono).
    // Ignora los cambios de altura producidos por la barra del navegador.
    let lastWidth = window.innerWidth;
    let resizeTimer;
    window.addEventListener("resize", () => {
      if (window.innerWidth === lastWidth) return;
      lastWidth = window.innerWidth;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(renderAll, 400);
    });

    renderAll();
  </script>
</body>
</html>
